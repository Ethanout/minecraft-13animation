name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools -p test_pack_workflow.py -v
      - run: python -m unittest discover -s examples/blocksequencer_mapping/objmc_fixed/tests -v
